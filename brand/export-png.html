<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zerk — PNG exporter</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; padding: 40px; background: #0a0a0a; color: #fff;
        font: 300 15px/1.5 Inter, "Helvetica Neue", Arial, sans-serif;
      }
      h1 { font-weight: 300; letter-spacing: 0.02em; font-size: 22px; }
      p { color: #888; max-width: 60ch; }
      .row { display: flex; align-items: center; gap: 20px; margin: 14px 0; }
      label { color: #888; font-size: 13px; }
      input { background: #111; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 6px 10px; width: 90px; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-top: 28px; }
      .card { border: 1px solid #222; border-radius: 14px; padding: 18px; background: #111; }
      .name { font-size: 13px; color: #888; margin-bottom: 12px; }
      .preview { display: flex; align-items: center; justify-content: center; height: 120px; border-radius: 10px; margin-bottom: 14px; }
      .preview.on-dark { background: #0a0a0a; }
      .preview.on-light { background: #f5f5f5; }
      button {
        background: #fff; color: #000; border: 0; border-radius: 999px;
        padding: 9px 16px; font: inherit; font-size: 13px; cursor: pointer; width: 100%;
      }
      button:hover { background: #ddd; }
      svg { max-width: 90%; max-height: 90%; }
    </style>
  </head>
  <body>
    <h1>Zerk — PNG exporter</h1>
    <p>
      Everything here runs in your browser; nothing is uploaded. Set a size, then click a button to
      download that asset as a transparent PNG (the icon keeps its dark tile). Square assets use the
      size as width &amp; height; the lockup keeps its aspect ratio at that height.
    </p>

    <div class="row">
      <label for="size">Size (px)</label>
      <input id="size" type="number" value="512" min="16" max="4096" step="16" />
      <button style="width:auto" onclick="downloadAll()">Download all</button>
    </div>

    <div class="grid" id="grid"></div>

    <script>
      // The five brand assets, inlined so this file is fully portable.
      const ASSETS = {
        "zerk-mark": { bg: "on-dark", square: true, svg:
`<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="28" height="28" rx="8" stroke="#FFFFFF" stroke-width="1.4" opacity="0.45"/><g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M9 9L13 13"/><path d="M23 9L19 13"/><path d="M9 23L13 19"/><path d="M23 23L19 19"/></g><circle cx="16" cy="16" r="2.4" fill="#FFFFFF"/></svg>` },
        "zerk-mark-black": { bg: "on-light", square: true, svg:
`<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="28" height="28" rx="8" stroke="#0A0A0A" stroke-width="1.4" opacity="0.45"/><g stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round"><path d="M9 9L13 13"/><path d="M23 9L19 13"/><path d="M9 23L13 19"/><path d="M23 23L19 19"/></g><circle cx="16" cy="16" r="2.4" fill="#0A0A0A"/></svg>` },
        "zerk-icon": { bg: "on-dark", square: true, svg:
`<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#0A0A0A"/><rect x="2" y="2" width="28" height="28" rx="8" stroke="#FFFFFF" stroke-width="1.4" opacity="0.45"/><g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M9 9L13 13"/><path d="M23 9L19 13"/><path d="M9 23L13 19"/><path d="M23 23L19 19"/></g><circle cx="16" cy="16" r="2.4" fill="#FFFFFF"/></svg>` },
        "zerk-logo-lockup": { bg: "on-dark", square: false, ratio: 200 / 48, svg:
`<svg viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg"><g transform="translate(8,8)"><rect x="2" y="2" width="28" height="28" rx="8" stroke="#FFFFFF" stroke-width="1.4" opacity="0.45"/><g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M9 9L13 13"/><path d="M23 9L19 13"/><path d="M9 23L13 19"/><path d="M23 23L19 19"/></g><circle cx="16" cy="16" r="2.4" fill="#FFFFFF"/></g><text x="52" y="30" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="300" letter-spacing="4.8" fill="#FFFFFF">ZERK</text></svg>` },
        "zerk-logo-lockup-black": { bg: "on-light", square: false, ratio: 200 / 48, svg:
`<svg viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg"><g transform="translate(8,8)"><rect x="2" y="2" width="28" height="28" rx="8" stroke="#0A0A0A" stroke-width="1.4" opacity="0.45"/><g stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round"><path d="M9 9L13 13"/><path d="M23 9L19 13"/><path d="M9 23L13 19"/><path d="M23 23L19 19"/></g><circle cx="16" cy="16" r="2.4" fill="#0A0A0A"/></g><text x="52" y="30" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="300" letter-spacing="4.8" fill="#0A0A0A">ZERK</text></svg>` },
      };

      const grid = document.getElementById("grid");
      for (const [name, a] of Object.entries(ASSETS)) {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
          `<div class="name">${name}.png</div>` +
          `<div class="preview ${a.bg}">${a.svg}</div>` +
          `<button data-name="${name}">Download PNG</button>`;
        grid.appendChild(card);
      }

      function exportOne(name) {
        const a = ASSETS[name];
        const size = Math.max(16, Math.min(4096, +document.getElementById("size").value || 512));
        const w = size;
        const h = a.square ? size : Math.round(size / a.ratio);
        const img = new Image();
        const url = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(a.svg)));
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          const ctx = c.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          c.toBlob((blob) => {
            const link = document.createElement("a");
            link.download = `${name}-${w}x${h}.png`;
            link.href = URL.createObjectURL(blob);
            link.click();
            URL.revokeObjectURL(link.href);
          }, "image/png");
        };
        img.src = url;
      }

      grid.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-name]");
        if (btn) exportOne(btn.dataset.name);
      });
      function downloadAll() { Object.keys(ASSETS).forEach((n, i) => setTimeout(() => exportOne(n), i * 250)); }
    </script>
  </body>
</html>
